name: docs-check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v5

      - name: 准备 Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Markdown 格式检查
        run: npx --yes markdownlint-cli2 "**/*.md"

      - name: 相对链接与锚点检查
        run: python3 scripts/check-links.py
